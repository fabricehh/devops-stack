global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: srv-observability
    env: production

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:

  # Prometheus lui-même
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  # Métriques serveur (srv-observability)
  - job_name: node-exporter
    static_configs:
      - targets: [node-exporter:9100]
        labels:
          instance: srv-observability

  # Métriques Docker (srv-observability)
  - job_name: cadvisor
    static_configs:
      - targets: [cadvisor:8080]
        labels:
          instance: srv-observability

  # OpenTelemetry Collector — métriques internes
  - job_name: otelcollector
    static_configs:
      - targets: [otelcollector:8888]

  # OpenTelemetry Collector — métriques applicatives (exportées via prometheus exporter)
  - job_name: otel-app-metrics
    static_configs:
      - targets: [otelcollector:8889]

  # Demo app (PoC — même serveur)
  - job_name: task-api
    static_configs:
      - targets: [task-api:5000]
        labels:
          service: task-api
          env: production

  # Serveurs applicatifs — découverte via fichiers (file_sd)
  # Ajouter un fichier par serveur dans prometheus/targets/
  - job_name: node-exporter-app-servers
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/node-exporter-*.yml
        refresh_interval: 60s

  - job_name: cadvisor-app-servers
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/cadvisor-*.yml
        refresh_interval: 60s
