global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Règles d'alerte
rule_files:
  - /etc/prometheus/rules/*.yml

# Envoi des alertes vers Alertmanager
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Cibles à scraper
scrape_configs:

  # Prometheus lui-même
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Métriques système (CPU, RAM, disque, réseau)
  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']

  # Métriques des conteneurs Docker
  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']

  # Auto-découverte Docker — scrape tout conteneur avec prometheus.io/scrape=true
  - job_name: docker-apps
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
    relabel_configs:
      # Garder uniquement les conteneurs optant pour le scraping
      - source_labels: [__meta_docker_container_label_prometheus_io_scrape]
        regex: 'true'
        action: keep
      # Utiliser le port déclaré dans le label
      - source_labels: [__meta_docker_container_name, __meta_docker_container_label_prometheus_io_port]
        regex: '/(.+);(\d+)'
        replacement: '$1:$2'
        target_label: __address__
      # Chemin /metrics personnalisable via label
      - source_labels: [__meta_docker_container_label_prometheus_io_path]
        regex: '(.+)'
        target_label: __metrics_path__
      # Nom du job = nom du conteneur
      - source_labels: [__meta_docker_container_name]
        regex: '/(.+)'
        replacement: '$1'
        target_label: job
