global:
  resolve_timeout: 5m
  smtp_smarthost: smtp.office365.com:587
  smtp_from: VOTRE_EMAIL@company.com        # remplacer
  smtp_auth_username: VOTRE_EMAIL@company.com  # remplacer
  smtp_auth_password: VOTRE_MOT_DE_PASSE      # remplacer
  smtp_require_tls: true

route:
  group_by: [alertname, severity, instance]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  receiver: teams

  routes:
    - matchers:
        - severity = critical
      receiver: critical
      continue: false

    - matchers:
        - severity = warning
      receiver: teams
      continue: false

    - matchers:
        - severity = info
      receiver: teams
      continue: false

receivers:

  # Alerte critique → Teams + Email
  - name: critical
    webhook_configs:
      - url: https://outlook.office.com/webhook/VOTRE-WEBHOOK-TEAMS  # remplacer
        send_resolved: true
        http_config:
          follow_redirects: true
    email_configs:
      - to: OPS-TEAM@company.com              # remplacer
        send_resolved: true
        html: |
          <b>Alerte : {{ .GroupLabels.alertname }}</b><br>
          Sévérité : <b style="color:red">{{ .GroupLabels.severity }}</b><br>
          {{ range .Alerts }}
            Instance : {{ .Labels.instance }}<br>
            {{ .Annotations.description }}<br>
          {{ end }}

  # Alerte warning/info → Teams uniquement
  - name: teams
    webhook_configs:
      - url: https://outlook.office.com/webhook/VOTRE-WEBHOOK-TEAMS  # remplacer
        send_resolved: true

inhibit_rules:
  - source_matchers:
      - severity = critical
    target_matchers:
      - severity = warning
    equal: [alertname, instance]
