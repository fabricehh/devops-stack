global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 3h
  receiver: default

  routes:
    # Alertes critiques -> email immédiat
    - match:
        severity: critical
      receiver: email-critical
      repeat_interval: 30m

receivers:
  # Récepteur par défaut (Slack)
  # >>> Remplacez par votre webhook Slack <<<
  - name: default
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/VOTRE/WEBHOOK/URL'
        channel: '#alertes'
        title: ':bell: {{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'

  # Récepteur email pour les critiques
  # >>> Remplacez par vos identifiants SMTP <<<
  - name: email-critical
    email_configs:
      - to: 'admin@devitlab.ddns.net'
        from: 'alertmanager@devitlab.ddns.net'
        smarthost: 'smtp.gmail.com:587'
        auth_username: 'votre@gmail.com'
        auth_password: 'votre_app_password'
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ['alertname', 'instance']
