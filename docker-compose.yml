# ─────────────────────────────────────────────────────────────────────────────
# Proof of Concept — tout sur un seul serveur
#
# Prérequis :
#   cp .env.example .env   (et remplir les valeurs)
#   touch traefik/acme.json && chmod 600 traefik/acme.json
#
# Démarrage :
#   docker compose up -d
#
# URLs (après propagation DNS) :
#   https://grafana.devitlab.ddns.net       admin / voir .env
#   https://prometheus.devitlab.ddns.net
#   https://alertmanager.devitlab.ddns.net
#   https://api.devitlab.ddns.net           Task API
#   https://api.devitlab.ddns.net/apidocs  Swagger UI
#   https://traefik.devitlab.ddns.net      Dashboard Traefik
# ─────────────────────────────────────────────────────────────────────────────

networks:
  traefik-net:
    driver: bridge
  monitoring:
    name: observability_monitoring
    driver: bridge

volumes:
  prometheus_data:
  alertmanager_data:
  grafana_data:
  loki_data:
  tempo_data:
  task_data:

services:

  # ─── Reverse Proxy ──────────────────────────────────────────────────────────

  traefik:
    image: traefik:v3.0
    container_name: traefik
    restart: unless-stopped
    command:
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.email=huehanou.houessou@gmail.com"
      - "--certificatesresolvers.letsencrypt.acme.storage=/acme/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--log.level=WARN"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/acme.json:/acme/acme.json
    networks:
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-dashboard.rule=Host(`traefik.devitlab.ddns.net`)"
      - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
      - "traefik.http.routers.traefik-dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"

  # ─── Métriques ──────────────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
      - "--web.enable-remote-write-receiver"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    networks:
      - monitoring
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.rule=Host(`prometheus.devitlab.ddns.net`)"
      - "traefik.http.routers.prometheus.entrypoints=websecure"
      - "traefik.http.routers.prometheus.tls.certresolver=letsencrypt"
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"

  node-exporter:
    image: prom/node-exporter:v1.8.1
    container_name: node-exporter
    restart: unless-stopped
    pid: host
    command:
      - "--path.rootfs=/host"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro,rslave
    networks:
      - monitoring

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /cgroup:/cgroup:ro
    networks:
      - monitoring

  # ─── Logs ───────────────────────────────────────────────────────────────────

  loki:
    image: grafana/loki:3.0.0
    container_name: loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./observability/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    networks:
      - monitoring

  # ─── Traces ─────────────────────────────────────────────────────────────────

  tempo:
    image: grafana/tempo:2.5.0
    container_name: tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo-config.yaml"]
    volumes:
      - ./observability/tempo/tempo-config.yaml:/etc/tempo/tempo-config.yaml:ro
      - tempo_data:/var/tempo
    networks:
      - monitoring

  # ─── OpenTelemetry Collector ─────────────────────────────────────────────────

  otelcollector:
    image: otel/opentelemetry-collector-contrib:0.101.0
    container_name: otelcollector
    restart: unless-stopped
    command: ["--config=/etc/otelcol/otelcol-config.yaml"]
    volumes:
      - ./observability/otelcollector/otelcol-config.yaml:/etc/otelcol/otelcol-config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    networks:
      - monitoring

  # ─── Alerting ───────────────────────────────────────────────────────────────

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    restart: unless-stopped
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    networks:
      - monitoring
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.alertmanager.rule=Host(`alertmanager.devitlab.ddns.net`)"
      - "traefik.http.routers.alertmanager.entrypoints=websecure"
      - "traefik.http.routers.alertmanager.tls.certresolver=letsencrypt"
      - "traefik.http.services.alertmanager.loadbalancer.server.port=9093"

  # ─── Dashboards ─────────────────────────────────────────────────────────────

  grafana:
    image: grafana/grafana:11.0.0
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:-changeme}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=https://grafana.devitlab.ddns.net
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=smtp.office365.com:587
      - GF_SMTP_USER=${SMTP_USER}
      - GF_SMTP_PASSWORD=${SMTP_PASSWORD}
      - GF_SMTP_FROM_ADDRESS=${SMTP_USER}
      - GF_SMTP_STARTTLS_POLICY=MandatoryStartTLS
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - monitoring
      - traefik-net
    depends_on:
      - prometheus
      - loki
      - tempo
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.devitlab.ddns.net`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls.certresolver=letsencrypt"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"

  # ─── Demo App ───────────────────────────────────────────────────────────────

  task-api:
    build:
      context: ./demo-app
      dockerfile: Dockerfile
    container_name: task-api
    restart: unless-stopped
    environment:
      - DATABASE_URL=sqlite:////app/data/tasks.db
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otelcollector:4317
      - OTEL_SERVICE_NAME=task-api
      - SERVICE_VERSION=1.0.0
      - DEPLOYMENT_ENVIRONMENT=production
      - LOG_LEVEL=INFO
    volumes:
      - task_data:/app/data
    ports:
      - "5000:5000"
    networks:
      - monitoring
      - traefik-net
    depends_on:
      - otelcollector
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.task-api.rule=Host(`api.devitlab.ddns.net`)"
      - "traefik.http.routers.task-api.entrypoints=websecure"
      - "traefik.http.routers.task-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.task-api.loadbalancer.server.port=5000"
