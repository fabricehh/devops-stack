networks:
  web:
    driver: bridge

volumes:
  uptime_data:
  task_data:

services:

  # ─── Reverse Proxy ──────────────────────────────────────────────────────────

  traefik:
    image: traefik:v3.0
    container_name: traefik
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.email=huehanou.houessou@gmail.com"
      - "--certificatesresolvers.letsencrypt.acme.storage=/acme/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/acme.json:/acme/acme.json
    networks: [web]

  # ─── Uptime Monitoring ──────────────────────────────────────────────────────

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    restart: unless-stopped
    volumes:
      - uptime_data:/app/data
    networks: [web]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.uptime.rule=Host(`uptime.devitlab.ddns.net`)"
      - "traefik.http.routers.uptime.entrypoints=websecure"
      - "traefik.http.routers.uptime.tls.certresolver=letsencrypt"
      - "traefik.http.services.uptime.loadbalancer.server.port=3001"

  # ─── Logs viewer ────────────────────────────────────────────────────────────

  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [web]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dozzle.rule=Host(`logs.devitlab.ddns.net`)"
      - "traefik.http.routers.dozzle.entrypoints=websecure"
      - "traefik.http.routers.dozzle.tls.certresolver=letsencrypt"
      - "traefik.http.services.dozzle.loadbalancer.server.port=8080"

  # ─── Demo App ───────────────────────────────────────────────────────────────

  task-api:
    build:
      context: ./demo-app
      dockerfile: Dockerfile
    container_name: task-api
    restart: unless-stopped
    environment:
      - DATABASE_URL=sqlite:////app/data/tasks.db
      - OTEL_EXPORTER_OTLP_ENDPOINT=
      - OTEL_SERVICE_NAME=task-api
      - SERVICE_VERSION=1.0.0
      - DEPLOYMENT_ENVIRONMENT=production
      - LOG_LEVEL=INFO
    volumes:
      - task_data:/app/data
    networks: [web]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.task-api.rule=Host(`api.devitlab.ddns.net`)"
      - "traefik.http.routers.task-api.entrypoints=websecure"
      - "traefik.http.routers.task-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.task-api.loadbalancer.server.port=5000"
