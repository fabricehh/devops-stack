services:
  flask-api:
    build: .
    image: flask-api-image
    container_name: flask-api
    restart: unless-stopped

    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-net
      # Auto-découverte Prometheus
      - prometheus.io/scrape=true
      - prometheus.io/port=5000
      - prometheus.io/path=/metrics
      # Domaine de l'API
      - traefik.http.routers.flask-api.rule=Host(`flask-api.devitlab.ddns.net`)
      - traefik.http.routers.flask-api.entrypoints=websecure
      - traefik.http.routers.flask-api.tls.certresolver=letsencrypt
      # Port interne du conteneur Flask
      - traefik.http.services.flask-api.loadbalancer.server.port=5000

    networks:
      - traefik-net
      - monitoring

  # Pousse alerts + dashboard + kibana dans les volumes partagés puis recharge Prometheus
  monitoring-init:
    image: alpine/curl
    container_name: flask-api-monitoring-init
    restart: "no"
    volumes:
      - ./monitoring/alerts.yml:/tmp/alerts.yml:ro
      - ./monitoring/dashboard.json:/tmp/dashboard.json:ro
      - ./monitoring/kibana.ndjson:/tmp/kibana.ndjson:ro
      - prometheus_rules:/prometheus_rules
      - grafana_dashboards:/grafana_dashboards
    command: >
      sh -c "
        echo '>>> Prometheus alerts...' &&
        cp /tmp/alerts.yml /prometheus_rules/flask-api.yml &&
        echo '>>> Grafana dashboard...' &&
        cp /tmp/dashboard.json /grafana_dashboards/flask-api.json &&
        echo '>>> Prometheus reload...' &&
        sleep 5 &&
        curl -s -X POST http://prometheus:9090/-/reload &&
        echo '>>> Kibana saved objects...' &&
        curl -s -X POST http://kibana:5601/api/saved_objects/_import?overwrite=true \
          -H 'kbn-xsrf: true' \
          -F file=@/tmp/kibana.ndjson &&
        echo 'Monitoring config pushed.'
      "
    networks:
      - monitoring

networks:
  traefik-net:
    external: true
  monitoring:
    external: true
    name: observability_monitoring

volumes:
  prometheus_rules:
    external: true
  grafana_dashboards:
    external: true
