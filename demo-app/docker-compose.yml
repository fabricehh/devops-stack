version: "3.9"

# Déploiement standalone — utilise les réseaux externes de la stack principale
networks:
  traefik-net:
    external: true
  observability_monitoring:
    external: true

volumes:
  task_data:

services:

  task-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: task-api
    restart: unless-stopped
    environment:
      - DATABASE_URL=sqlite:////app/data/tasks.db
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otelcollector:4317
      - OTEL_SERVICE_NAME=task-api
      - SERVICE_VERSION=1.0.0
      - DEPLOYMENT_ENVIRONMENT=production
      - LOG_LEVEL=INFO
    volumes:
      - task_data:/app/data
    ports:
      - "5000:5000"
    networks:
      - traefik-net
      - observability_monitoring
    labels:
      # Traefik — routing HTTPS
      - "traefik.enable=true"
      - "traefik.http.routers.task-api.rule=Host(`api.devitlab.ddns.net`)"
      - "traefik.http.routers.task-api.entrypoints=websecure"
      - "traefik.http.routers.task-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.task-api.loadbalancer.server.port=5000"
      # Prometheus scrape direct
      - "prometheus.scrape=true"
      - "prometheus.port=5000"
      - "prometheus.path=/metrics"
